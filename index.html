<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Hub d'IA Perso</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            width: 380px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin-bottom: 8px; color: #ec4899; }
        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
        
        /* Utilisation d'une balise <a> classique pour que le lien et le clic fonctionnent à coup sûr */
        .matiere-card {
            display: flex;
            align-items: center;
            background: #334155;
            padding: 14px 16px;
            margin: 12px 0;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #475569;
            transition: all 0.2s;
            text-decoration: none;
            color: white;
        }
        .matiere-card:hover {
            transform: scale(1.02);
            border-color: #ec4899;
            background: #38bdf815;
        }
        .matiere-icon {
            font-size: 1.5rem;
            margin-right: 14px;
        }
        .matiere-info {
            text-align: left;
            flex: 1;
        }
        .matiere-title {
            font-weight: bold;
            font-size: 1rem;
        }
        .matiere-desc {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .arrow {
            color: #64748b;
            font-weight: bold;
            font-size: 1.2rem;
            transition: color 0.2s;
        }
        .matiere-card:hover .arrow {
            color: #ec4899;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>🚀 Ton Hub d'IA</h1>
        <p class="subtitle">Choisis ta matière pour bosser avec Léa :</p>
        
        <!-- Lien vers ton fichier maths.html -->
        <a href="maths.html" class="matiere-card">
            <span class="matiere-icon">📐</span>
            <div class="matiere-info">
                <div class="matiere-title">Maths</div>
                <div class="matiere-desc">Calculs, géométrie & problèmes</div>
            </div>
            <span class="arrow">➔</span>
        </a>

        <!-- Lien vers ton fichier francais.html -->
        <a href="francais.html" class="matiere-card">
            <span class="matiere-icon">📚</span>
            <div class="matiere-info">
                <div class="matiere-title">Français</div>
                <div class="matiere-desc">Conjugaison, grammaire & accords</div>
            </div>
            <span class="arrow">➔</span>
        </a>

        <!-- Lien vers ton fichier histoire.html -->
        <a href="histoire.html" class="matiere-card">
            <span class="matiere-icon">🌍</span>
            <div class="matiere-info">
                <div class="matiere-title">Histoire / Géo</div>
                <div class="matiere-desc">Dates clés, repères & civilisations</div>
            </div>
            <span class="arrow">➔</span>
        </a>
    </div>

</body>
</html>
